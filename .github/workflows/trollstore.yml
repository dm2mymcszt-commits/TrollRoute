name: Build TrollStore package

on:
  workflow_dispatch:
  push:
    branches: [experiment/route-motion]
    paths-ignore: ['**.md']

permissions:
  contents: read

jobs:
  live-activity-ui:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        appearance: [dark, light]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      ACTIVITY_APPEARANCE: ${{ matrix.appearance }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Exercise real Live Activity surfaces and intents
        run: bash Tests/LiveActivity/check.sh
      - name: Upload Live Activity system evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-activity-ui-${{ matrix.appearance }}
          path: |
            build/live-activity-qa/build.log
            build/live-activity-qa/tests.log
            build/live-activity-qa/runtimes.json
            build/live-activity-qa/activity-system.log
            build/live-activity-qa/crashes
            build/live-activity-qa/attachments
            build/live-activity-qa/System.xcresult
          if-no-files-found: ignore
          retention-days: 14
  share-lifecycle-ui:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Exercise share delivery across app lifecycle states
        run: bash Tests/ShareLifecycle/check.sh
      - name: Upload share lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: share-lifecycle-ui
          path: |
            build/share-lifecycle-qa/tests.log
            build/share-lifecycle-qa/attachments
            build/share-lifecycle-qa/Lifecycle.xcresult
          if-no-files-found: ignore
          retention-days: 14
  map-workspace-ui:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check map workspace and capture previews
        run: bash Tests/MapWorkspace/check.sh

      - name: Upload map workspace previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: map-workspace-preview
          path: |
            build/map-workspace-qa/*.png
            build/map-workspace-qa/gestures.log
            build/map-workspace-qa/Gestures.xcresult
            build/map-workspace-qa/attachments
          if-no-files-found: ignore
          retention-days: 14

  route-session-ui:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Exercise actual Navigation and route-session controls
        run: bash Tests/RouteSessionUI/check.sh
      - name: Upload route-session UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: route-session-ui
          path: |
            build/route-session-ui/tests.log
            build/route-session-ui/attachments
            build/route-session-ui/Session.xcresult
          if-no-files-found: ignore
          retention-days: 14
  icon-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Render icon comparison without changing app assets
        run: |
          npm ci --prefix Design/Icon --ignore-scripts --no-audit --no-fund
          python3 -m venv "$RUNNER_TEMP/icon-env"
          "$RUNNER_TEMP/icon-env/bin/pip" install -r Design/Icon/requirements.txt
          node Design/Icon/render.cjs
          "$RUNNER_TEMP/icon-env/bin/python" Design/Icon/compare.py
          cp Design/Icon/output/render.sha256 "$RUNNER_TEMP/first-render.sha256"
          node Design/Icon/render.cjs
          "$RUNNER_TEMP/icon-env/bin/python" Design/Icon/compare.py
          cmp "$RUNNER_TEMP/first-render.sha256" Design/Icon/output/render.sha256
          "$RUNNER_TEMP/icon-env/bin/python" Design/Icon/compare.py --verify-installed
          git diff --exit-code -- TrollRoute/Assets.xcassets
      - name: Upload icon approval comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: icon-approval-${{ github.sha }}
          path: Design/Icon/output/
          if-no-files-found: error
          retention-days: 30

  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          brew install ldid
          xcodebuild -version

      - name: Check app identity
        run: python3 Tests/Identity/check.py

      - name: Package version
        id: version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' TrollRoute/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: |
          set -o pipefail
          bash ipabuild.sh 2>&1 | tee "$RUNNER_TEMP/trollstore-build.log"
          test -s build/TrollRoute.tipa
          unzip -t build/TrollRoute.tipa
          python3 Tests/Identity/check.py build/TrollRoute.tipa
          python3 Tests/Identity/package-signing.py build/TrollRoute.tipa

      - name: Check read-only data migration
        run: bash Tests/Migration/check.sh

      - name: Check simulated motion metadata
        run: bash Tests/RouteMotion/check-location.sh

      - name: Check shared location ownership and previous spoof
        run: bash Tests/LocationSession/check.sh

      - name: Check injection cadence, cancellation and motion preservation
        run: bash Tests/Injection/check.sh

      - name: Check route calculation and movement
        run: bash Tests/RouteSimulation/check.sh

      - name: Check actual route engine and live finish actions
        run: bash Tests/RouteEngine/check.sh

      - name: Check saved altitude, motion preservation, and worldwide elevation
        run: bash Tests/Altitude/check.sh

      - name: Check location access and registration status
        run: bash Tests/LocationAccess/check.sh

      - name: Check safe map moves and confirmation
        run: bash Tests/MapMoveSafety/check.sh

      - name: Check location parsers and seven worldwide addresses
        run: bash Tests/AddressSearch/check.sh

      - name: Check shared places and route endpoint handoff
        run: bash Tests/SharedPlace/check.sh

      - name: Check route map and capture previews
        run: bash Tests/RouteMap/check.sh

      - name: Upload route map previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: route-map-preview-${{ github.run_id }}
          path: build/route-map-qa/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload TrollStore package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TrollRoute-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: build/TrollRoute.tipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trollstore-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Check route picker and capture preview
        run: bash Tests/RoutePicker/check.sh

      - name: Upload route picker preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: route-picker-preview-${{ github.run_id }}
          path: build/route-picker-qa/*.png
          if-no-files-found: ignore
          retention-days: 14
