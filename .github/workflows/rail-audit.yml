name: Offline rail feasibility audit

on:
  push:
    branches: [codex/round31-validation]
    paths: ['Tools/RailAudit/**', '.github/workflows/rail-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-rail-audit
  cancel-in-progress: false

jobs:
  france:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install audit tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool python3-pyosmium
          osmium --version
          /usr/bin/python3 --version
      - name: Check measurement on disconnected real-track fixture
        run: /usr/bin/python3 Tools/RailAudit/check.py
      - name: Download one pinned extract and measure rail data
        run: bash Tools/RailAudit/run.sh
      - name: Preserve measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: france-offline-rail-audit
          path: |
            build/rail-audit/*.json
            build/rail-audit/*.txt
          retention-days: 30
          if-no-files-found: warn
